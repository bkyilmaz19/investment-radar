name: Monitor Trade Signals

on:
  workflow_dispatch:
  schedule:
    # Runs every 15 minutes in a broad UTC window.
    # monitor.py itself only acts during 09:25–16:15 America/New_York.
    - cron: '*/15 13-22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: investment-radar-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Check entry and exit signals
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
        run: python monitor.py

      - name: Save alert state
        run: |
          git config user.name "investment-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/push_state.json
          git diff --cached --quiet || git commit -m "Update push alert state"
          git pull --rebase
          git push
