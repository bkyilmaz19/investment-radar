name: Monitor Trade Signals

on:
  workflow_dispatch:
  schedule:
    # Alle 15 Minuten Mo-Fr in einem breiten UTC-Zeitfenster.
    # monitor.py entscheidet zusätzlich, ob gerade relevante US-Handelszeit ist.
    - cron: '*/15 13-21 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: investment-radar-live
  cancel-in-progress: true

jobs:
  scan_and_monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh intraday radar
        run: python radar.py

      - name: Check fresh entry and exit signals
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: https://ntfy.sh

          # Verbindung zum Cloudflare Worker
          WORKER_URL: ${{ secrets.WORKER_URL }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}

        run: python monitor.py

      - name: Save live radar and alert state
        run: |
          git config user.name "investment-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/radar.json state/push_state.json

          git diff --cached --quiet || git commit -m "Refresh intraday radar and alerts"

          git pull --rebase
          git push

  deploy:
    needs: scan_and_monitor
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Pull latest changes
        run: git pull

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy live dashboard
        id: deployment
        uses: actions/deploy-pages@v4
