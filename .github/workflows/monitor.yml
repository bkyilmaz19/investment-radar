name: Monitor Trade Signals

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes on US trading days in a broad UTC window.
    # radar.py refreshes the setup first; monitor.py then acts on the fresh result.
    # monitor.py itself only sends trading alerts during 09:25-16:15 America/New_York.
    - cron: '*/15 13-21 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: investment-radar-live
  cancel-in-progress: true

jobs:
  scan_and_monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Refresh intraday radar
        run: python radar.py

      - name: Check fresh entry and exit signals
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: https://ntfy.sh
        run: python monitor.py

      - name: Save live radar and alert state
        run: |
          git config user.name "investment-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/radar.json state/push_state.json
          git diff --cached --quiet || git commit -m "Refresh intraday radar and alerts"
          git pull --rebase
          git push

  deploy:
    needs: scan_and_monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - run: git pull
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy live dashboard
        id: deployment
        uses: actions/deploy-pages@v4
