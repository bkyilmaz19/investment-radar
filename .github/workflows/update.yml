name: Update Investment Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '7 8 * * 1-5'
      timezone: 'Europe/Berlin'
    - cron: '17 10 * * 1-5'
      timezone: 'Europe/Berlin'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: investment-radar-live
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build fresh short-term radar data
        run: python radar.py
      - name: Save updated data
        run: |
          git config user.name "investment-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/radar.json
          git diff --cached --quiet || git commit -m "Update short-term radar"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - run: git pull
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
